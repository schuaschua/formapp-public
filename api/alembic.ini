# Alembic configuration (spine AD-10, AD-17). Migrations run only in the deploy pipeline, never when
# api starts. The connection comes from the libpq environment variables (PGHOST, PGUSER, PGPASSWORD,
# PGDATABASE, PGSSLMODE) and migrations/env.py runs SET ROLE to DB_MIGRATION_ROLE when it is set.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
